<style>

    --radius:14px;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:linear-gradient(180deg,#f4f6fb 0%,#eef1f8 100%);color:var(--text);

  header.top{padding:22px 24px 10px; border-bottom:1px solid var(--border); position:sticky; top:0;

  header.top h1{margin:0 0 4px; font-size:20px; font-weight:700; letter-spacing:.2px; color:#0f172a;}

  .tab-btn{background:#2f6fed; border:2px solid #2f6fed; color:#fff;
    padding:8px 16px; border-radius:999px; cursor:pointer; font-size:13px; font-weight:600;
    transition:.15s;}
  .tab-btn:hover{background:#1f57c9; border-color:#1f57c9; color:#fff;}

  .panel{background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); padding:16px; box-shadow:0 1px 2px rgba(16,24,40,.04);}
  .panel h3{margin:0 0 12px; font-size:13.5px; font-weight:700; color:#0f172a;}
  .barrow{display:flex; align-items:center; gap:10px; margin-bottom:10px; font-size:12.5px;}
  .barrow .lbl{width:130px; flex-shrink:0; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .barrow .bar-bg{flex:1; height:16px; background:#e7ebf5; border-radius:6px; overflow:hidden; position:relative;}
  .barrow .bar-fg{height:100%; border-radius:6px; background:linear-gradient(90deg,var(--accent),var(--accent2));}
  .barrow .val{width:70px; text-align:right; flex-shrink:0; font-weight:700; color:#0f172a;}
  table{width:100%; border-collapse:collapse; font-size:12.5px;}
  th{text-align:right; color:var(--muted); font-weight:800; padding:8px 10px; border-bottom:1px solid var(--border); font-size:11.5px; text-transform:uppercase; letter-spacing:.3px;}
  th:first-child, td:first-child{text-align:left; font-weight:700; color:#0f172a;}
  td{padding:7px 10px; border-bottom:1px solid #eef1f8; text-align:right; white-space:nowrap; font-weight:700; color:#0f172a;}
  tr.row-ss{cursor:pointer; background:var(--panel2); font-weight:700;}
  tr.row-ss:hover{background:#e2e8f7;}
  tr.row-ss td:first-child{display:flex; align-items:center; gap:6px;}
  tr.row-ss .chev{display:inline-block; transition:transform .15s; color:var(--accent); font-size:10px;}
  tr.row-ss.open .chev{transform:rotate(90deg);}
  tr.row-sm{display:none;}
  tr.row-sm.show{display:table-row;}
  tr.row-sm td:first-child{padding-left:26px; color:var(--muted);}
  tr.row-total{font-weight:800; background:#e6ecfb;}
  .pct{font-weight:700; padding:2px 8px; border-radius:6px; display:inline-block; min-width:48px;}
  .pct.g{background:rgba(31,157,85,.12); color:var(--green);}
  .pct.y{background:rgba(183,121,31,.14); color:var(--yellow);}
  .pct.r{background:rgba(224,57,43,.12); color:var(--red);}
  .table-wrap{overflow-x:auto; border-radius:var(--radius); border:1px solid var(--border);}
  .table-wrap table{background:var(--panel);}
  .foot-note{color:var(--muted); font-size:11px; margin-top:8px;}
  .pill{display:inline-block; padding:2px 9px; border-radius:999px; background:var(--panel2); border:1px solid var(--border); font-size:11px; color:var(--muted); margin-right:6px;}
  .two-col-table{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  @media(max-width:820px){.two-col-table{grid-template-columns:1fr;}}
</style>

// ---------- formatters ----------
function fmtInt(v){ return Math.round(v||0).toLocaleString('vi-VN'); }
function fmtTy(v){ return (((v||0))/1e9).toLocaleString('vi-VN',{minimumFractionDigits:1,maximumFractionDigits:1}) + ' tỷ'; }
function fmtTr(v){ return (((v||0))/1e6).toLocaleString('vi-VN',{minimumFractionDigits:1,maximumFractionDigits:1}) + ' tr'; }
function fmtPct(v){ return ((v||0)*100).toLocaleString('vi-VN',{minimumFractionDigits:1,maximumFractionDigits:1}) + '%'; }
function pctClass(p){ if(p>=1) return 'g'; if(p>=0.8) return 'y'; return 'r'; }

function ssShort(ss){
  if(!ss) return '';
  const parts = String(ss).split('-');
  return parts.length>1 ? parts.slice(1).join('-') : ss;
}
function barRow(label, val, total){
  const p = total? val/total : 0;
  return `<div class="barrow"><div class="lbl">${esc(label)}</div><div class="bar-bg"><div class="bar-fg" style="width:${(p*100).toFixed(1)}%"></div></div><div class="val">${fmtPct(p)}</div></div>`;
}
function barRowRaw(label, val, max, valText){
  const p = max? val/max : 0;
  return `<div class="barrow"><div class="lbl">${esc(label)}</div><div class="bar-bg"><div class="bar-fg" style="width:${(p*100).toFixed(1)}%"></div></div><div class="val">${valText}</div></div>`;
}

        <td>${fmtInt(r.aug_buy)}</td><td>${fmtInt(r.aug_nobuy)}</td><td>${fmtTy(r.aug_ds)}</td>
        <td>${fmtInt(r.sep_buy)}</td><td>${fmtInt(r.sep_nobuy)}</td><td>${fmtTy(r.sep_ds)}</td>
        <td>${deltaBadge(r.chg)}</td></tr>`).join('')}
      </tbody></table></div>
  </section>`;
  const bts = D.compare.by_type_ss || [];
  const tyRow = (r,cls,grp,label,bold)=>`<tr class="${cls}" data-grp="${grp}"><td style="text-align:left${bold?';font-weight:800':''}">${label}</td>
        <td>${fmtInt(r.total_outlet)}</td>
        <td>${fmtInt(r.aug_buy)}</td><td>${fmtInt(r.aug_nobuy)}</td><td>${fmtTy(r.aug_ds)}</td>
        <td>${fmtInt(r.sep_buy)}</td><td>${fmtInt(r.sep_nobuy)}</td><td>${fmtTy(r.sep_ds)}</td>
        <td>${deltaBadge(r.chg)}</td></tr>`;
  let html3 = `<section class="block">
    <p class="block-title">Doanh số theo nhóm khách hàng — chi tiết SS → nhóm KH (T8 vs T9)</p>
    <p class="block-desc">Quầy gán SS & nhóm KH theo Visit Schedule tháng 9 cho cả 2 tháng · T8 từ 061_T8, T9 từ cột U (DS T9) · bấm dòng SS để mở nhóm KH</p>
    <div class="table-wrap"><table>
      <thead><tr><th>SS → Nhóm KH</th><th>Tổng quầy</th><th>Quầy mua T8</th><th>Quầy ko mua T8</th><th>DS T8</th><th>Quầy mua T9</th><th>Quầy ko mua T9</th><th>DS T9 (MTD)</th><th>%Thay đổi DS</th></tr></thead>
      <tbody>${bts.map((s,i)=>{
        let rows = tyRow(s,'row-ss','cmpt'+i,`<span class="chev">▶</span>${esc(s.group)}`,false);
        rows += s.groups.map(g=>tyRow(g,'row-sm','cmpt'+i,esc(g.group),g.group!=='CH LẺ')).join('');
        return rows;
      }).join('')}
      </tbody></table></div>
  </section>`;
  el.innerHTML = html + html2 + html3;
  bindDrilldown(el);
}


// ================= APO TRACKING =================
function renderAPO(){
  const el = document.getElementById('tab-apo');
  const a = D.apo; if(!a){ el.innerHTML=''; return; }
  const r = a.region;
  const pc = (x,y)=> y? pctBadge(x/y) : '—';
  const tier = o => o.ytd>=o.o ? 'O' : o.ytd>=o.he ? 'HE' : o.ytd>=o.e ? 'E' : 'Chưa đạt';
  const tierBadge = t => { const c = t==='Chưa đạt' ? 'r' : t==='E' ? 'y' : 'g'; return `<span class="pct ${c}">${t}</span>`; };
  const cells = o => `<td>${fmtTy(o.so)}</td><td>${fmtTy(o.tg)}</td><td>${pc(o.so,o.tg)}</td>
      <td>${fmtTy(o.ytd)}</td><td>${pc(o.ytd,o.e)}</td><td>${pc(o.ytd,o.he)}</td><td>${pc(o.ytd,o.o)}</td><td>${tierBadge(tier(o))}</td>`;
  const TIERS = ['O','HE','E','Chưa đạt'];
  const countT = arr => { const c={O:0,HE:0,E:0,'Chưa đạt':0}; arr.forEach(o=>c[tier(o)]++); return c; };
  const allSM = a.ss.flatMap(s=>s.sms);
  const cSS = countT(a.ss), cSM = countT(allSM);
  let html = `<section class="block">
    <p class="block-title">📈 APO Tracking — Tháng 9 & lũy kế năm (YTD)</p>
    <p class="block-desc">${esc(a.note)} · TG_YTD_E / HE / O = 3 mức target lũy kế năm</p>
    <div class="cards">
      <div class="card"><div class="k">SO tháng 9</div><div class="v">${fmtTy(r.so)}</div></div>
      <div class="card"><div class="k">Target tháng 9</div><div class="v">${fmtTy(r.tg)}</div></div>
      <div class="card"><div class="k">% tháng 9</div><div class="v">${pc(r.so,r.tg)}</div></div>
      <div class="card"><div class="k">SO YTD</div><div class="v">${fmtTy(r.ytd)}</div></div>
      <div class="card"><div class="k">% vs TG YTD E</div><div class="v">${pc(r.ytd,r.e)}</div><div class="delta">TG ${fmtTy(r.e)}</div></div>
      <div class="card"><div class="k">% vs TG YTD HE</div><div class="v">${pc(r.ytd,r.he)}</div><div class="delta">TG ${fmtTy(r.he)}</div></div>
      <div class="card"><div class="k">% vs TG YTD O</div><div class="v">${pc(r.ytd,r.o)}</div><div class="delta">TG ${fmtTy(r.o)}</div></div>
    </div>
  </section>`;
  html += `<section class="block">
    <p class="block-title">🏅 Tracking mức đạt YTD — E / HE / O</p>
    <p class="block-desc">Mỗi SS/SM xếp theo mức cao nhất đã đạt: O (SO YTD ≥ TG O) › HE › E › Chưa đạt · Võ Văn Hiếu tính 2 dòng theo 2 mã SS · lũy kế: đạt từ E trở lên = O + HE + E</p>
    <div class="table-wrap"><table>
      <thead><tr><th>Cấp</th><th>Tổng</th><th>Đạt O</th><th>Đạt HE</th><th>Đạt E</th><th>Chưa đạt</th><th>Đạt ≥ E</th></tr></thead>
      <tbody>
        ${[['SS', a.ss.length, cSS],['SM', allSM.length, cSM]].map(([lab,n,c])=>`<tr><td style="text-align:left;font-weight:800">${lab}</td><td>${n}</td>
          <td>${c.O}</td><td>${c.HE}</td><td>${c.E}</td><td>${c['Chưa đạt']}</td><td>${pctBadge((c.O+c.HE+c.E)/n)} ${c.O+c.HE+c.E}/${n}</td></tr>`).join('')}
      </tbody></table></div>
    <p class="block-title" style="margin-top:14px;font-size:15px">Số SM theo mức đạt — từng SS</p>
    <div class="table-wrap"><table>
      <thead><tr><th>SS</th><th>Số SM</th><th>Đạt O</th><th>Đạt HE</th><th>Đạt E</th><th>Chưa đạt</th><th>Mức SS</th></tr></thead>
      <tbody>${a.ss.map(s=>{ const c=countT(s.sms); return `<tr><td style="text-align:left">${esc(s.name)}</td><td>${s.sms.length}</td>
          <td>${c.O}</td><td>${c.HE}</td><td>${c.E}</td><td>${c['Chưa đạt']}</td><td>${tierBadge(tier(s))}</td></tr>`; }).join('')}
        <tr class="row-total"><td>TỔNG</td><td>${allSM.length}</td><td>${cSM.O}</td><td>${cSM.HE}</td><td>${cSM.E}</td><td>${cSM['Chưa đạt']}</td><td>${tierBadge(tier(r))}</td></tr>
      </tbody></table></div>
  </section>`;
  html += `<section class="block">
    <p class="block-title">Chi tiết SS → SM</p>
    <p class="block-desc">Bấm dòng SS để mở SM · % tháng 9 = SO T9 / Target T9 · % YTD = SO YTD / từng mức target YTD</p>
    <div class="table-wrap"><table>
      <thead><tr><th>SS → SM</th><th>SO T9</th><th>Target T9</th><th>% T9</th><th>SO YTD</th><th>% vs E</th><th>% vs HE</th><th>% vs O</th><th>Mức đạt YTD</th></tr></thead>
      <tbody>${a.ss.map((s,i)=>{
        let rows = `<tr class="row-ss" data-grp="apo${i}"><td><span class="chev">▶</span>${esc(s.name)}</td>${cells(s)}</tr>`;
        rows += s.sms.slice().sort((x,y)=>(y.so/(y.tg||1))-(x.so/(x.tg||1))).map(m=>`<tr class="row-sm" data-grp="apo${i}"><td>${esc(m.name)}</td>${cells(m)}</tr>`).join('');
        return rows;
      }).join('')}
      <tr class="row-total"><td>TỔNG KV ĐẶNG QUANG VINH</td>${cells(r)}</tr>
      </tbody></table></div>
  </section>`;
  el.innerHTML = html;
  bindDrilldown(el);
}


// ================= PHƯỜNG XÃ YTD vs LY =================
function renderWard(){
  const el = document.getElementById('tab-ward');
  const W = D.ward; if(!W){ el.innerHTML=''; return; }
  const ssList = [...new Set(W.rows.map(r=>r.ss))].sort();
  const state = {ss:'ALL'};
  const fmtM = v => Math.abs(v)>=1e9 ? (v/1e9).toLocaleString('vi-VN',{minimumFractionDigits:2,maximumFractionDigits:2})+' tỷ' : Math.round(v/1e6).toLocaleString('vi-VN')+' tr';
  const gB = g => `<span class="pct ${g>=0?'g':'r'}">${g>=0?'▲':'▼'} ${fmtPct(Math.abs(g))}</span>`;
  const smChips = r => r.sms.map(m=>`<span class="pill" style="margin:1px 2px;display:inline-block">${esc(m.sm)} · ${m.n}</span>`).join('');
  const pctCell = r => r.pct==null ? '<span class="pill">Mới (LY = 0)</span>' :
     `<span class="pct ${r.pct>=0?'g':'r'}">${r.pct>=0?'▲':'▼'} ${fmtPct(Math.abs(r.pct))}</span>${r.small_ly?' <span class="pill" title="LY rất nhỏ, % không có ý nghĩa">LY nhỏ</span>':''}`;
  const rowHtml = r => `<tr><td style="text-align:left;font-weight:700">${esc(r.ward)}</td><td style="text-align:left">${esc(r.ss)}</td>
      <td style="text-align:left;white-space:normal;min-width:220px">${smChips(r)}</td>
      <td>${fmtInt(r.mcp)}</td><td>${fmtInt(r.aso)}</td><td>${fmtM(r.so)}</td><td>${r.ly==null?'—':fmtM(r.ly)}</td>
      <td>${r.diff==null?'—':`<span class="pct ${r.diff>=0?'g':'r'}">${r.diff>=0?'+':'−'}${fmtM(Math.abs(r.diff))}</span>`}</td><td>${pctCell(r)}</td></tr>`;
  const table = (title, desc, rows) => `<section class="block">
    <p class="block-title">${title} (${rows.length})</p><p class="block-desc">${desc}</p>
    <div class="table-wrap"><table>
      <thead><tr><th>Phường / xã</th><th>SS phụ trách</th><th>SM phụ trách · số quầy</th><th>MCP</th><th>ASO</th><th>SO YTD</th><th>LY</th><th>Chênh lệch</th><th>% tăng trưởng</th></tr></thead>
      <tbody>${rows.length? rows.map(rowHtml).join('') : '<tr><td colspan="9">Không có</td></tr>'}</tbody></table></div></section>`;
  function draw(){
    const rs = W.rows.filter(r=> state.ss==='ALL' || r.ss===state.ss);
    const down = rs.filter(r=>r.status==='down').sort((a,b)=>a.diff-b.diff);
    const up = rs.filter(r=>r.status==='up').sort((a,b)=>b.diff-a.diff);
    const nw = rs.filter(r=>r.status==='new');
    const so = rs.reduce((a,r)=>a+r.so,0), ly = rs.reduce((a,r)=>a+(r.ly||0),0);
    let html = `<section class="block">
      <p class="block-title">🗺️ Tăng trưởng theo phường / xã — SO YTD vs LY</p>
      <p class="block-desc">${esc(W.note)} · SM lấy theo cột Ward của Visit Schedule, số sau tên = số quầy SM đó quản lý trong phường/xã</p>
      <div style="margin:6px 0 12px"><label style="font-weight:700;margin-right:8px">Lọc SS:</label>
        <select id="ward-ss" style="padding:6px 10px;border-radius:8px;border:1px solid var(--border);background:var(--panel);color:var(--text)">
          <option value="ALL">Tất cả SS</option>${ssList.map(x=>`<option value="${esc(x)}"${state.ss===x?' selected':''}>${esc(x)}</option>`).join('')}
        </select></div>
      <div class="cards">
        <div class="card"><div class="k">Phường/xã đang ÂM</div><div class="v" style="color:var(--red)">${down.length}<small>/ ${rs.length}</small></div><div class="delta">${fmtM(Math.abs(down.reduce((a,r)=>a+r.diff,0)))} bị hụt</div></div>
        <div class="card"><div class="k">Phường/xã đang TĂNG</div><div class="v" style="color:var(--green)">${up.length}<small>/ ${rs.length}</small></div><div class="delta">+${fmtM(up.reduce((a,r)=>a+r.diff,0))}</div></div>
        <div class="card"><div class="k">Mới phát sinh (LY = 0)</div><div class="v">${nw.length}</div></div>
        <div class="card"><div class="k">SO YTD</div><div class="v">${fmtTy(so)}</div><div class="delta">LY ${fmtTy(ly)}</div></div>
        <div class="card"><div class="k">% tăng trưởng</div><div class="v">${gB(so/ly-1)}</div></div>
      </div></section>`;
    if(state.ss==='ALL'){
      html += `<section class="block"><p class="block-title">Tổng hợp theo SS</p><div class="table-wrap"><table>
        <thead><tr><th>SS</th><th>Số phường/xã</th><th>Đang âm</th><th>Đang tăng</th><th>Mới</th><th>SO YTD</th><th>LY</th><th>%</th></tr></thead><tbody>
        ${ssList.map(x=>{ const g=W.rows.filter(r=>r.ss===x); const a=g.reduce((t,r)=>t+r.so,0), b=g.reduce((t,r)=>t+(r.ly||0),0);
          const nd=g.filter(r=>r.status==='down').length;
          return `<tr><td style="text-align:left">${esc(x)}</td><td>${g.length}</td><td>${nd?`<span class="pct r">${nd}</span>`:'0'}</td><td>${g.filter(r=>r.status==='up').length}</td><td>${g.filter(r=>r.status==='new').length}</td><td>${fmtTy(a)}</td><td>${fmtTy(b)}</td><td>${gB(a/b-1)}</td></tr>`; }).join('')}
        </tbody></table></div></section>`;
    }
    html += table('🔻 Phường/xã đang ÂM so với LY','Sắp xếp theo mức hụt lớn nhất', down);
    html += table('🔺 Phường/xã đang TĂNG so với LY','Sắp xếp theo mức tăng tuyệt đối lớn nhất · "LY nhỏ" = LY dưới 50 triệu, % tăng không có ý nghĩa so sánh', up);
    if(nw.length) html += table('🆕 Phường/xã mới phát sinh (không có LY)','', nw);
    el.innerHTML = html;
    el.querySelector('#ward-ss').addEventListener('change', e=>{ state.ss=e.target.value; draw(); });
  }
  draw();
}

// ================= wiring =================
function bindDrilldown(root){
  root.querySelectorAll('tr.row-ss').forEach(row=>{
    row.addEventListener('click', ()=>{
      const grp = row.dataset.grp;
      const open = row.classList.toggle('open');
      root.querySelectorAll(`tr.row-sm[data-grp="${grp}"]`).forEach(r=>r.classList.toggle('show', open));
    });
  });
}

function bindTabs(){
  document.querySelectorAll('.tab-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
      document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('tab-'+btn.dataset.tab).classList.add('active');
    });
  });
}

renderTongQuan();
renderMBS();
renderGrowth();
renderSOTarget();
renderPhoto();
renderSoSanh();
renderAPO();
renderWard();
bindDrilldown(document.getElementById('tab-tongquan'));
bindDrilldown(document.getElementById('tab-sotarget'));
bindTabs();

</script>
