<style>

    --green:#1f9d55; --yellow:#b7791f; --red:#e0392b;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:linear-gradient(180deg,#f4f6fb 0%,#eef1f8 100%);color:var(--text);

    font-size:14px; line-height:1.5;}
  header.top{padding:22px 24px 10px; border-bottom:1px solid var(--border); position:sticky; top:0;
    background:rgba(244,246,251,.92); backdrop-filter:blur(6px); z-index:50;}
  header.top h1{margin:0 0 4px; font-size:20px; font-weight:700; letter-spacing:.2px; color:#0f172a;}
  header.top .sub{color:var(--muted); font-size:12.5px;}
  .tabs{display:flex; gap:6px; margin-top:14px; flex-wrap:wrap;}
  .tab-btn{background:var(--panel); border:1px solid var(--border); color:var(--muted);
    padding:8px 16px; border-radius:999px; cursor:pointer; font-size:13px; font-weight:600;
    transition:.15s;}
  .tab-btn:hover{color:var(--text); border-color:var(--accent);}
  .tab-btn.active{background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#fff; border-color:transparent;}
  main{max-width:1180px; margin:0 auto; padding:20px 24px 80px;}
  .tab-panel{display:none;}
  .tab-panel.active{display:block; animation:fade .25s ease;}
  @keyframes fade{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;}}
  section.block{margin-bottom:30px;}
  section.block .block-title{font-size:15px; font-weight:700; margin:0 0 4px; color:#0f172a;}
  section.block .block-desc{color:var(--muted); font-size:12px; margin:0 0 14px;}
  .cards{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin-bottom:16px;}
  .card{background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); padding:14px 16px; box-shadow:0 1px 2px rgba(16,24,40,.04);}
  .card .k{color:var(--muted); font-size:11.5px; text-transform:uppercase; letter-spacing:.4px; margin-bottom:6px;}
  .card .v{font-size:21px; font-weight:800; color:#0f172a;}
  .card .v small{font-size:12px; color:var(--muted); font-weight:600; margin-left:4px;}
  .card .delta{font-size:11.5px; margin-top:4px; color:var(--muted);}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  @media(max-width:720px){.grid2{grid-template-columns:1fr;}}
  .panel{background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); padding:16px; box-shadow:0 1px 2px rgba(16,24,40,.04);}
  .panel h3{margin:0 0 12px; font-size:13.5px; font-weight:700; color:#0f172a;}
  .barrow{display:flex; align-items:center; gap:10px; margin-bottom:10px; font-size:12.5px;}
  .barrow .lbl{width:130px; flex-shrink:0; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .barrow .bar-bg{flex:1; height:16px; background:#e7ebf5; border-radius:6px; overflow:hidden; position:relative;}
  .barrow .bar-fg{height:100%; border-radius:6px; background:linear-gradient(90deg,var(--accent),var(--accent2));}
  .barrow .val{width:70px; text-align:right; flex-shrink:0; font-weight:700; color:#0f172a;}
  table{width:100%; border-collapse:collapse; font-size:12.5px;}
  th{text-align:right; color:var(--muted); font-weight:800; padding:8px 10px; border-bottom:1px solid var(--border); font-size:11.5px; text-transform:uppercase; letter-spacing:.3px;}
  th:first-child, td:first-child{text-align:left; font-weight:700; color:#0f172a;}
  td{padding:7px 10px; border-bottom:1px solid #eef1f8; text-align:right; white-space:nowrap; font-weight:700; color:#0f172a;}
  tr.row-ss{cursor:pointer; background:var(--panel2); font-weight:700;}
  tr.row-ss:hover{background:#e2e8f7;}
  tr.row-ss td:first-child{display:flex; align-items:center; gap:6px;}
  tr.row-ss .chev{display:inline-block; transition:transform .15s; color:var(--accent); font-size:10px;}
  tr.row-ss.open .chev{transform:rotate(90deg);}
  tr.row-sm{display:none;}
  tr.row-sm.show{display:table-row;}
  tr.row-sm td:first-child{padding-left:26px; color:var(--muted);}
  tr.row-total{font-weight:800; background:#e6ecfb;}
  .pct{font-weight:700; padding:2px 8px; border-radius:6px; display:inline-block; min-width:48px;}
  .pct.g{background:rgba(31,157,85,.12); color:var(--green);}
  .pct.y{background:rgba(183,121,31,.14); color:var(--yellow);}
  .pct.r{background:rgba(224,57,43,.12); color:var(--red);}
  .table-wrap{overflow-x:auto; border-radius:var(--radius); border:1px solid var(--border);}
  .table-wrap table{background:var(--panel);}
  .foot-note{color:var(--muted); font-size:11px; margin-top:8px;}
  .pill{display:inline-block; padding:2px 9px; border-radius:999px; background:var(--panel2); border:1px solid var(--border); font-size:11px; color:var(--muted); margin-right:6px;}
  .two-col-table{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  @media(max-width:820px){.two-col-table{grid-template-columns:1fr;}}
</style>
</head>

<script>
const D = window.__DATA__;

// ---------- formatters ----------
function fmtInt(v){ return Math.round(v||0).toLocaleString('vi-VN'); }
function fmtTy(v){ return (((v||0))/1e9).toLocaleString('vi-VN',{minimumFractionDigits:1,maximumFractionDigits:1}) + ' tỷ'; }
function fmtTr(v){ return (((v||0))/1e6).toLocaleString('vi-VN',{minimumFractionDigits:1,maximumFractionDigits:1}) + ' tr'; }
function fmtPct(v){ return ((v||0)*100).toLocaleString('vi-VN',{minimumFractionDigits:1,maximumFractionDigits:1}) + '%'; }
function pctClass(p){ if(p>=1) return 'g'; if(p>=0.8) return 'y'; return 'r'; }
function pctBadge(p){ return `<span class="pct ${pctClass(p)}">${fmtPct(p)}</span>`; }
function esc(s){ return (s==null?'':String(s)); }

// ================= TỔNG QUAN =================
function renderTongQuan(){
  const el = document.getElementById('tab-tongquan');
  const ov = D.overview;
  const kpi = D.kpi_nen_tang;
  let html = '';

  // --- Cards tổng quan quầy ---
  const o = ov.overall;
  const pctDat = o.active/o.quay;
  const vpo = o.ds/(o.active||1);
  html += `
  <section class="block">
    <p class="block-title">Tổng quan quầy &amp; doanh số — tháng 9/2026 (tính đến giữa tháng)</p>
    <p class="block-desc">Nguồn: Visit Schedule Report tháng 9 (13.063 quầy) · cột DS T9 = doanh số phát sinh từ đầu tháng đến thời điểm xuất file · vì mới nửa tháng nên %Đạt sẽ thấp hơn cuối tháng đáng kể</p>
    <div class="cards">
      <div class="card"><div class="k">Tổng quầy</div><div class="v">${fmtInt(o.quay)}</div></div>
      <div class="card"><div class="k">Active (có DS T9)</div><div class="v">${fmtInt(o.active)}</div><div class="delta">${fmtPct(pctDat)} tổng quầy</div></div>
      <div class="card"><div class="k">DS Tháng 9 (MTD)</div><div class="v">${fmtTy(o.ds)}</div></div>
      <div class="card"><div class="k">VPO</div><div class="v">${fmtTr(vpo)}</div><div class="delta">DS / quầy active</div></div>
    </div>
  </section>`;

  // --- Kênh Off/On + Nhóm KH ---
  const chMap = {}; ov.by_channel.forEach(c=>chMap[c.channel]=c);
  const off = chMap['Kênh Off Premise']||{quay:0,active:0,ds:0};
  const on = chMap['Kênh On Premise']||{quay:0,active:0,ds:0};
  const typeOrder = ['CH LẺ','VIP3','VIP5','VIPSI'];
  const typeMap = {}; ov.by_type.forEach(t=>typeMap[t.type]=t);

  html += `<section class="block"><div class="grid2">
    <div class="panel">
      <h3>Cơ cấu theo kênh</h3>
      ${barRow('Off Premise', off.active, off.quay)}
      ${barRow('On Premise', on.active, on.quay)}
      <div class="foot-note">Off: ${fmtInt(off.quay)} quầy · ${fmtPct(off.active/off.quay)} đạt &nbsp;|&nbsp; On: ${fmtInt(on.quay)} quầy · ${fmtPct(on.active/on.quay)} đạt</div>
    </div>
    <div class="panel">
      <h3>Cơ cấu theo nhóm khách hàng</h3>
      ${typeOrder.map(t=>{const v=typeMap[t]||{quay:0,active:0}; return barRow(t, v.active, v.quay);}).join('')}
    </div>
  </div></section>`;

  // --- Bảng NPP -> SS quầy/active ---
  html += `<section class="block">
    <p class="block-title">Bảng chi tiết quầy theo NPP → SS</p>
    <p class="block-desc">Bấm dòng NPP để mở SS bên trong</p>
    <div class="table-wrap"><table>
      <thead><tr><th>NPP → SS</th><th>Quầy</th><th>Active T9</th><th>%Đạt</th><th>DS T9</th></tr></thead>
      <tbody>`;
  ov.npp_list.forEach((n,i)=>{
    html += `<tr class="row-ss" data-grp="npp${i}"><td><span class="chev">▶</span>${esc(n.npp)}</td>
      <td>${fmtInt(n.quay)}</td><td>${fmtInt(n.active)}</td><td>${pctBadge(n.active/n.quay)}</td><td>${fmtTr(n.ds)}</td></tr>`;
    n.ss_rows.forEach(s=>{
      html += `<tr class="row-sm" data-grp="npp${i}"><td>${esc(s.ss)}</td><td>${fmtInt(s.quay)}</td><td>${fmtInt(s.active)}</td><td>${pctBadge(s.active/s.quay)}</td><td>${fmtTr(s.ds)}</td></tr>`;
    });
  });
  const totQ=o.quay, totA=o.active;
  html += `<tr class="row-total"><td>TỔNG KHU VỰC</td><td>${fmtInt(totQ)}</td><td>${fmtInt(totA)}</td><td>${pctBadge(totA/totQ)}</td><td>${fmtTr(o.ds)}</td></tr>`;
  html += `</tbody></table></div></section>`;

  // --- KPI Nền tảng ---
  const r = kpi.region;
  html += `<section class="block">
    <p class="block-title">🎯 KPI Nền tảng (PC · LPPC) — toàn khu vực</p>
    <p class="block-desc">PC = số đơn hàng phát sinh trong kỳ · LPPC = SKU thoả MOQ / đơn · nguồn: file FUNDAMENTAL</p>
    <div class="cards">
      <div class="card"><div class="k">Sale Out</div><div class="v">${fmtTy(r.sale_out)}</div></div>
      <div class="card"><div class="k">Target</div><div class="v">${fmtTy(r.target)}</div></div>
      <div class="card"><div class="k">% vs Target</div><div class="v">${pctBadge(r.pct)}</div></div>
      <div class="card"><div class="k">ASO Off</div><div class="v">${fmtInt(r.aso_off)}</div></div>
      <div class="card"><div class="k">MCP</div><div class="v">${fmtInt(r.mcp)}</div></div>
      <div class="card"><div class="k">% COV</div><div class="v">${fmtPct(r.pct_cov)}</div></div>
      <div class="card"><div class="k">LPPC</div><div class="v">${(r.lppc).toFixed(1)}</div></div>
      <div class="card"><div class="k">PC/SM/Day</div><div class="v">${(r.pc).toFixed(1)}</div></div>
    </div>
    <div class="panel" style="margin-bottom:14px;">
      <h3>Sale Out theo SS</h3>
      ${kpi.ss_list.slice().sort((a,b)=>b.total.sale_out-a.total.sale_out).map(s=>{
        const max = Math.max(...kpi.ss_list.map(x=>x.total.sale_out));
        return barRowRaw(ssShort(s.ss), s.total.sale_out, max, fmtTy(s.total.sale_out));
      }).join('')}
    </div>
    <div class="table-wrap"><table>
      <thead><tr><th>SS → SM</th><th>Sale Out</th><th>Target</th><th>%vsTG</th><th>ASO Off</th><th>MCP</th><th>%COV</th><th>LPPC</th><th>PC/SM/Day</th></tr></thead>
      <tbody>`;
  kpi.ss_list.forEach((s,i)=>{
    const t = s.total;
    html += `<tr class="row-ss" data-grp="kpi${i}"><td><span class="chev">▶</span>${ssShort(s.ss)}</td>
      <td>${fmtTy(t.sale_out)}</td><td>${fmtTy(t.target)}</td><td>${pctBadge(t.pct)}</td>
      <td>${fmtInt(t.aso_off)}</td><td>${fmtInt(t.mcp)}</td><td>${fmtPct(t.pct_cov)}</td>
      <td>${t.lppc.toFixed(1)}</td><td>${t.pc.toFixed(1)}</td></tr>`;
    s.sms.forEach(m=>{
      html += `<tr class="row-sm" data-grp="kpi${i}"><td>${esc(m.sm)}</td>
        <td>${fmtTy(m.sale_out)}</td><td>${fmtTy(m.target)}</td><td>${pctBadge(m.pct)}</td>
        <td>${fmtInt(m.aso_off)}</td><td>${fmtInt(m.mcp)}</td><td>${fmtPct(m.pct_cov)}</td>
        <td>${m.lppc.toFixed(1)}</td><td>${m.pc.toFixed(1)}</td></tr>`;
    });
  });
  html += `<tr class="row-total"><td>TỔNG KV ĐẶNG QUANG VINH</td><td>${fmtTy(r.sale_out)}</td><td>${fmtTy(r.target)}</td><td>${pctBadge(r.pct)}</td><td>${fmtInt(r.aso_off)}</td><td>${fmtInt(r.mcp)}</td><td>${fmtPct(r.pct_cov)}</td><td>${r.lppc.toFixed(1)}</td><td>${r.pc.toFixed(1)}</td></tr>`;
  html += `</tbody></table></div></section>`;

  // --- MBS quick summary card ---
  const mbsQuick = D.mbs.total;
  html += `<section class="block">
    <p class="block-title">🎯 MBS — nhanh</p>
    <div class="cards">
      <div class="card"><div class="k">Doanh số thực hiện</div><div class="v">${fmtTy(mbsQuick.th)}</div></div>
      <div class="card"><div class="k">% Đạt (vs chỉ tiêu)</div><div class="v">${pctBadge(mbsQuick.th/mbsQuick.ct)}</div></div>
      <div class="card"><div class="k">Quầy đạt</div><div class="v">${fmtInt(mbsQuick.dat)}<small>/ ${fmtInt(mbsQuick.n)}</small></div></div>
    </div>
  </section>`;

  // --- ASO phát sinh doanh số theo kênh Off/On (từ 061) ---
  const ac = D.aso_channel;
  if (ac) {
    html += `<section class="block">
      <p class="block-title">ASO phát sinh doanh số — theo kênh Off / On (061)</p>

      <div class="cards">
        <div class="card"><div class="k">ASO Off Premise</div><div class="v">${fmtInt(ac.total.off_aso)}<small>/ ${fmtInt(ac.total.off_mcp)}</small></div><div class="delta">${pctBadge(ac.total.off_aso/ac.total.off_mcp)}</div></div>
        <div class="card"><div class="k">ASO On Premise</div><div class="v">${fmtInt(ac.total.on_aso)}<small>/ ${fmtInt(ac.total.on_mcp)}</small></div><div class="delta">${pctBadge(ac.total.on_aso/ac.total.on_mcp)}</div></div>

        <tbody>${ac.ss_list.map((s,i)=>{
          let rows = `<tr class="row-ss" data-grp="asoch${i}"><td><span class="chev">▶</span>${esc(s.ss)}</td>

function ssShort(ss){
  if(!ss) return '';
  const parts = String(ss).split('-');
  return parts.length>1 ? parts.slice(1).join('-') : ss;
}
function barRow(label, val, total){
  const p = total? val/total : 0;
  return `<div class="barrow"><div class="lbl">${esc(label)}</div><div class="bar-bg"><div class="bar-fg" style="width:${(p*100).toFixed(1)}%"></div></div><div class="val">${fmtPct(p)}</div></div>`;
}
function barRowRaw(label, val, max, valText){
  const p = max? val/max : 0;
  return `<div class="barrow"><div class="lbl">${esc(label)}</div><div class="bar-bg"><div class="bar-fg" style="width:${(p*100).toFixed(1)}%"></div></div><div class="val">${valText}</div></div>`;
}

      <div class="card"><div class="k">Tổng thu nhập cả tháng</div><div class="v">${fmtTy(l.total_tn)}</div></div>
      <div class="card"><div class="k">Bình quân / người</div><div class="v">${fmtTr(l.total_tn/l.total_n)}</div></div>
    </div>
  </section>`;

  function tbl(title, rows, keyLabel){
    return `<section class="block"><p class="block-title">${title}</p>
    <div class="table-wrap"><table>
      <thead><tr><th>${keyLabel}</th><th>Số NVBH</th><th>Lương cơ bản (tổng)</th><th>Lương kinh doanh (tổng)</th><th>Tổng thu nhập</th><th>BQ/người</th></tr></thead>
      <tbody>${rows.sort((a,b)=>b.tong_thu_nhap-a.tong_thu_nhap).map(r=>`<tr><td style="text-align:left">${esc(r.ss||r.npp)}</td>
        <td>${fmtInt(r.n)}</td><td>${fmtTr(r.luong_cb)}</td><td>${fmtTr(r.luong_kd)}</td><td>${fmtTr(r.tong_thu_nhap)}</td><td>${fmtTr(r.tong_thu_nhap/r.n)}</td></tr>`).join('')}
      </tbody></table></div></section>`;
  }
  html += tbl('Theo SS', l.by_ss, 'SS');
  html += tbl('Theo NPP', l.by_npp, 'NPP');

  el.innerHTML = html;
}

// ================= SO SÁNH T8 vs T9 =================
function renderSoSanh(){
  const el = document.getElementById('tab-sosanh');
  const c = D.compare;
  let html = '';
  html += `<section class="block">
    <p class="block-title">📊 So sánh KPI — Tháng 8 vs Tháng 9/2026</p>
    <p class="block-desc" style="color:var(--red); font-weight:600;">⚠️ Tháng 9 mới tính đến giữa tháng (dữ liệu chưa đủ tháng), còn Tháng 8 là số đủ tháng — nên các % thay đổi dưới đây phần lớn phản ánh "chưa hết tháng", KHÔNG phải xu hướng giảm thực sự. Chỉ nên dùng để so sánh sau khi hết tháng 9.</p>
    <div class="table-wrap"><table>
      <thead><tr><th>KPI</th><th>Tháng 8</th><th>Tháng 9 (MTD)</th><th>Thay đổi</th></tr></thead>
      <tbody>${c.region.map(r=>{
        let augStr, sepStr;
        if(r.fmt==='ty'){ augStr=fmtTy(r.aug); sepStr=fmtTy(r.sep); }
        else if(r.fmt==='int'){ augStr=fmtInt(r.aug); sepStr=fmtInt(r.sep); }
        else if(r.fmt==='pct'){ augStr=fmtPct(r.aug); sepStr=fmtPct(r.sep); }
        else { augStr=r.aug.toFixed(1); sepStr=r.sep.toFixed(1); }
        const chg = r.is_point ? `${(r.change_pct*100).toFixed(1).replace('-','−')} đpt` : fmtPct(Math.abs(r.change_pct)) ;
        const cls = r.change_pct>=0 ? 'g' : 'r';
        const sign = r.change_pct>=0 ? '▲' : '▼';
        return `<tr><td style="text-align:left${(r.metric==='Sale Out'||r.metric==='PC/SM/Day'||r.metric==='LPPC')?';font-weight:800':''}">${esc(r.metric)}</td><td>${augStr}</td><td>${sepStr}</td>
          <td><span class="pct ${cls}">${sign} ${r.is_point? Math.abs(r.change_pct*100).toFixed(1)+' đpt' : fmtPct(Math.abs(r.change_pct))}</span></td></tr>`;
      }).join('')}
      </tbody></table></div>
  </section>`;

  html += `<section class="block">
    <p class="block-title">Sale Out theo SS → SM — Tháng 8 vs Tháng 9 (MTD)</p>
    <p class="block-desc">Hoàng Trọng Quý (T9) kế thừa mã SS 19SF14999A trước đây thuộc Nguyễn Danh Phong (T8), nên số T8 của Quý = số của mã 19SF14999A · bấm dòng SS để mở SM</p>
    <div class="table-wrap"><table>
      <thead><tr><th>SS → SM</th><th>Sale Out T8</th><th>Sale Out T9 (MTD)</th><th>Thay đổi</th></tr></thead>
      <tbody>${c.ss.map((s,i)=>{
        let rows;
        if(s.aug_sale_out==null){
          rows = `<tr class="row-ss" data-grp="cmpso${i}"><td><span class="chev">▶</span>${esc(s.ss)}</td><td>—</td><td>${fmtTy(s.sep_sale_out)}</td><td><span class="pill">N/A</span></td></tr>`;
        } else {
          const cls = s.change_pct>=0?'g':'r'; const sign = s.change_pct>=0?'▲':'▼';
          rows = `<tr class="row-ss" data-grp="cmpso${i}"><td><span class="chev">▶</span>${esc(s.ss)}</td><td>${fmtTy(s.aug_sale_out)}</td><td>${fmtTy(s.sep_sale_out)}</td>
            <td><span class="pct ${cls}">${sign} ${fmtPct(Math.abs(s.change_pct))}</span></td></tr>`;
        }
        rows += (s.sms||[]).map(m=>{
          if(m.aug_sale_out==null) return `<tr class="row-sm" data-grp="cmpso${i}"><td>${esc(m.sm)}</td><td>—</td><td>${fmtTy(m.sep_sale_out)}</td><td><span class="pill">N/A</span></td></tr>`;
          if(m.sep_sale_out==null) return `<tr class="row-sm" data-grp="cmpso${i}"><td>${esc(m.sm)}</td><td>${fmtTy(m.aug_sale_out)}</td><td>—</td><td><span class="pill">N/A</span></td></tr>`;
          return `<tr class="row-sm" data-grp="cmpso${i}"><td>${esc(m.sm)}</td><td>${fmtTy(m.aug_sale_out)}</td><td>${fmtTy(m.sep_sale_out)}</td><td>${deltaBadge(m.chg_sale_out)}</td></tr>`;
        }).join('');
        return rows;
      }).join('')}
      </tbody></table></div>
  </section>`;

  function deltaBadge(chg){
    if(chg==null) return '<span class="pill">N/A</span>';
    const cls = chg>=0?'g':'r'; const sign = chg>=0?'▲':'▼';
    return `<span class="pct ${cls}">${sign} ${fmtPct(Math.abs(chg))}</span>`;
  }

  html += `<section class="block">
    <p class="block-title">LPPC · ASO · PC/SM/Day theo SS → SM — Tháng 8 vs Tháng 9 (MTD)</p>
    <p class="block-desc">Bấm dòng SS để mở SM</p>
    <div class="table-wrap"><table>
      <thead><tr><th>SS → SM</th><th>LPPC T8</th><th>LPPC T9</th><th>Δ</th><th>ASO T8</th><th>ASO T9</th><th>Δ</th><th>PC/SM/Day T8</th><th>PC/SM/Day T9</th><th>Δ</th></tr></thead>
      <tbody>${c.ss.map((s,i)=>{
        let rows = `<tr class="row-ss" data-grp="cmpk${i}"><td><span class="chev">▶</span>${esc(s.ss)}</td>
          <td>${s.aug_lppc!=null?s.aug_lppc.toFixed(1):'—'}</td><td>${s.sep_lppc!=null?s.sep_lppc.toFixed(1):'—'}</td><td>${deltaBadge(s.chg_lppc)}</td>
          <td>${s.aug_aso!=null?fmtInt(s.aug_aso):'—'}</td><td>${s.sep_aso!=null?fmtInt(s.sep_aso):'—'}</td><td>${deltaBadge(s.chg_aso)}</td>
          <td>${s.aug_pc!=null?s.aug_pc.toFixed(1):'—'}</td><td>${s.sep_pc!=null?s.sep_pc.toFixed(1):'—'}</td><td>${deltaBadge(s.chg_pc)}</td></tr>`;
        rows += (s.sms||[]).map(m=>`<tr class="row-sm" data-grp="cmpk${i}"><td>${esc(m.sm)}</td>
          <td>${m.aug_lppc!=null?m.aug_lppc.toFixed(1):'—'}</td><td>${m.sep_lppc!=null?m.sep_lppc.toFixed(1):'—'}</td><td>${deltaBadge(m.chg_lppc)}</td>
          <td>${m.aug_aso!=null?fmtInt(m.aug_aso):'—'}</td><td>${m.sep_aso!=null?fmtInt(m.sep_aso):'—'}</td><td>${deltaBadge(m.chg_aso)}</td>
          <td>${m.aug_pc!=null?m.aug_pc.toFixed(1):'—'}</td><td>${m.sep_pc!=null?m.sep_pc.toFixed(1):'—'}</td><td>${deltaBadge(m.chg_pc)}</td></tr>`).join('');
        return rows;
      }).join('')}
      </tbody></table></div>
  </section>`;

  el.innerHTML = html;

  // --- Nhóm khách hàng VIP3/VIP5/VIPSI/CH LẺ ---
  const bt = D.compare.by_type;
  let html2 = `<section class="block">
    <p class="block-title">Doanh số theo nhóm khách hàng — Tháng 8 vs Tháng 9 (MTD)</p>
    <p class="block-desc">Nguồn: 061 đối chiếu Type Outlet từ Visit Schedule (dùng chung danh sách quầy tháng 9 cho cả 2 tháng vì không có Visit Schedule riêng tháng 8) · loại trừ ${fmtTy(bt.aug_excluded_none)} (T8) / ${fmtTy(bt.sep_excluded_none)} (T9) đơn không gắn mã quầy</p>
    <div class="table-wrap"><table>
      <thead><tr><th>Nhóm KH</th><th>Tổng quầy</th><th>Quầy mua T8</th><th>Quầy ko mua T8</th><th>DS T8</th><th>Quầy mua T9</th><th>Quầy ko mua T9</th><th>DS T9 (MTD)</th><th>%Thay đổi DS</th></tr></thead>
      <tbody>${bt.rows.map(r=>`<tr><td style="text-align:left${(r.group==='VIP3'||r.group==='VIP5'||r.group==='VIPSI')?';font-weight:800':''}">${esc(r.group)}</td>
        <td>${fmtInt(r.total_outlet)}</td>
        <td>${fmtInt(r.aug_buy)}</td><td>${fmtInt(r.aug_nobuy)}</td><td>${fmtTy(r.aug_ds)}</td>
        <td>${fmtInt(r.sep_buy)}</td><td>${fmtInt(r.sep_nobuy)}</td><td>${fmtTy(r.sep_ds)}</td>
        <td>${deltaBadge(r.chg)}</td></tr>`).join('')}
      </tbody></table></div>
  </section>`;
  el.innerHTML = html + html2;
  bindDrilldown(el);
}

// ================= wiring =================
function bindDrilldown(root){
  root.querySelectorAll('tr.row-ss').forEach(row=>{
    row.addEventListener('click', ()=>{
      const grp = row.dataset.grp;
      const open = row.classList.toggle('open');
      root.querySelectorAll(`tr.row-sm[data-grp="${grp}"]`).forEach(r=>r.classList.toggle('show', open));
    });
  });
}

function bindTabs(){
  document.querySelectorAll('.tab-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
      document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('tab-'+btn.dataset.tab).classList.add('active');
    });
  });
}

renderTongQuan();
renderMBS();
renderGrowth();
renderSOTarget();
renderPhoto();
renderSoSanh();
bindDrilldown(document.getElementById('tab-tongquan'));
bindDrilldown(document.getElementById('tab-mbs'));
bindDrilldown(document.getElementById('tab-sotarget'));
bindTabs();

</script>
