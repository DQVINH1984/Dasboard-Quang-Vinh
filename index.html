<style>
  :root{
    --bg:#f4f6fb; --panel:#ffffff; --panel2:#eef1f8; --border:#dbe1ee;

    --green:#1f9d55; --yellow:#b7791f; --red:#e0392b;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:linear-gradient(180deg,#f4f6fb 0%,#eef1f8 100%);color:var(--text);

    font-size:14px; line-height:1.5;}
  header.top{padding:22px 24px 10px; border-bottom:1px solid var(--border); position:sticky; top:0;
    background:rgba(244,246,251,.92); backdrop-filter:blur(6px); z-index:50;}
  header.top h1{margin:0 0 4px; font-size:20px; font-weight:700; letter-spacing:.2px; color:#0f172a;}
  header.top .sub{color:var(--muted); font-size:12.5px;}
  .tabs{display:flex; gap:6px; margin-top:14px; flex-wrap:wrap;}
  .tab-btn{background:var(--panel); border:1px solid var(--border); color:var(--muted);
    padding:8px 16px; border-radius:999px; cursor:pointer; font-size:13px; font-weight:600;
    transition:.15s;}
  .tab-btn:hover{color:var(--text); border-color:var(--accent);}
  .tab-btn.active{background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#fff; border-color:transparent;}
  main{max-width:1180px; margin:0 auto; padding:20px 24px 80px;}
  .tab-panel{display:none;}
  .tab-panel.active{display:block; animation:fade .25s ease;}
  @keyframes fade{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;}}
  section.block{margin-bottom:30px;}
  section.block .block-title{font-size:15px; font-weight:700; margin:0 0 4px; color:#0f172a;}
  section.block .block-desc{color:var(--muted); font-size:12px; margin:0 0 14px;}
  .cards{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin-bottom:16px;}
  .card{background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); padding:14px 16px; box-shadow:0 1px 2px rgba(16,24,40,.04);}
  .card .k{color:var(--muted); font-size:11.5px; text-transform:uppercase; letter-spacing:.4px; margin-bottom:6px;}
  .card .v{font-size:21px; font-weight:800; color:#0f172a;}
  .card .v small{font-size:12px; color:var(--muted); font-weight:600; margin-left:4px;}
  .card .delta{font-size:11.5px; margin-top:4px; color:var(--muted);}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  @media(max-width:720px){.grid2{grid-template-columns:1fr;}}
  .panel{background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); padding:16px; box-shadow:0 1px 2px rgba(16,24,40,.04);}
  .panel h3{margin:0 0 12px; font-size:13.5px; font-weight:700; color:#0f172a;}
  .barrow{display:flex; align-items:center; gap:10px; margin-bottom:10px; font-size:12.5px;}
  .barrow .lbl{width:130px; flex-shrink:0; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .barrow .bar-bg{flex:1; height:16px; background:#e7ebf5; border-radius:6px; overflow:hidden; position:relative;}
  .barrow .bar-fg{height:100%; border-radius:6px; background:linear-gradient(90deg,var(--accent),var(--accent2));}
  .barrow .val{width:70px; text-align:right; flex-shrink:0; font-weight:700; color:#0f172a;}
  table{width:100%; border-collapse:collapse; font-size:12.5px;}
  th{text-align:right; color:var(--muted); font-weight:600; padding:8px 10px; border-bottom:1px solid var(--border); font-size:11.5px; text-transform:uppercase; letter-spacing:.3px;}
  th:first-child, td:first-child{text-align:left;}
  td{padding:7px 10px; border-bottom:1px solid #eef1f8; text-align:right; white-space:nowrap;}
  tr.row-ss{cursor:pointer; background:var(--panel2); font-weight:700;}
  tr.row-ss:hover{background:#e2e8f7;}
  tr.row-ss td:first-child{display:flex; align-items:center; gap:6px;}
  tr.row-ss .chev{display:inline-block; transition:transform .15s; color:var(--accent); font-size:10px;}
  tr.row-ss.open .chev{transform:rotate(90deg);}
  tr.row-sm{display:none;}
  tr.row-sm.show{display:table-row;}
  tr.row-sm td:first-child{padding-left:26px; color:var(--muted);}
  tr.row-total{font-weight:800; background:#e6ecfb;}
  .pct{font-weight:700; padding:2px 8px; border-radius:6px; display:inline-block; min-width:48px;}
  .pct.g{background:rgba(31,157,85,.12); color:var(--green);}
  .pct.y{background:rgba(183,121,31,.14); color:var(--yellow);}
  .pct.r{background:rgba(224,57,43,.12); color:var(--red);}
  .table-wrap{overflow-x:auto; border-radius:var(--radius); border:1px solid var(--border);}
  .table-wrap table{background:var(--panel);}
  .foot-note{color:var(--muted); font-size:11px; margin-top:8px;}
  .pill{display:inline-block; padding:2px 9px; border-radius:999px; background:var(--panel2); border:1px solid var(--border); font-size:11px; color:var(--muted); margin-right:6px;}
  .two-col-table{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  @media(max-width:820px){.two-col-table{grid-template-columns:1fr;}}
</style>
</head>

<script>
const D = window.__DATA__;

// ---------- formatters ----------
function fmtInt(v){ return Math.round(v||0).toLocaleString('vi-VN'); }
function fmtTy(v){ return (((v||0))/1e9).toLocaleString('vi-VN',{minimumFractionDigits:1,maximumFractionDigits:1}) + ' tỷ'; }
function fmtTr(v){ return (((v||0))/1e6).toLocaleString('vi-VN',{minimumFractionDigits:1,maximumFractionDigits:1}) + ' tr'; }
function fmtPct(v){ return ((v||0)*100).toLocaleString('vi-VN',{minimumFractionDigits:1,maximumFractionDigits:1}) + '%'; }
function pctClass(p){ if(p>=1) return 'g'; if(p>=0.8) return 'y'; return 'r'; }
function pctBadge(p){ return `<span class="pct ${pctClass(p)}">${fmtPct(p)}</span>`; }
function esc(s){ return (s==null?'':String(s)); }

// ================= TỔNG QUAN =================
function renderTongQuan(){
  const el = document.getElementById('tab-tongquan');
  const ov = D.overview;
  const kpi = D.kpi_nen_tang;
  let html = '';

  // --- Cards tổng quan quầy ---
  const o = ov.overall;
  const pctDat = o.active/o.quay;
  const vpo = o.ds/(o.active||1);
  html += `
  <section class="block">
    <p class="block-title">Tổng quan quầy &amp; doanh số — tháng 9/2026 (tính đến giữa tháng)</p>
    <p class="block-desc">Nguồn: Visit Schedule Report tháng 9 (13.063 quầy) · cột DS T9 = doanh số phát sinh từ đầu tháng đến thời điểm xuất file · vì mới nửa tháng nên %Đạt sẽ thấp hơn cuối tháng đáng kể</p>
    <div class="cards">
      <div class="card"><div class="k">Tổng quầy</div><div class="v">${fmtInt(o.quay)}</div></div>
      <div class="card"><div class="k">Active (có DS T9)</div><div class="v">${fmtInt(o.active)}</div><div class="delta">${fmtPct(pctDat)} tổng quầy</div></div>
      <div class="card"><div class="k">DS Tháng 9 (MTD)</div><div class="v">${fmtTy(o.ds)}</div></div>
      <div class="card"><div class="k">VPO</div><div class="v">${fmtTr(vpo)}</div><div class="delta">DS / quầy active</div></div>
    </div>
  </section>`;

  // --- Kênh Off/On + Nhóm KH ---
  const chMap = {}; ov.by_channel.forEach(c=>chMap[c.channel]=c);
  const off = chMap['Kênh Off Premise']||{quay:0,active:0,ds:0};
  const on = chMap['Kênh On Premise']||{quay:0,active:0,ds:0};
  const typeOrder = ['CH LẺ','VIP3','VIP5','VIPSI'];
  const typeMap = {}; ov.by_type.forEach(t=>typeMap[t.type]=t);

  html += `<section class="block"><div class="grid2">
    <div class="panel">
      <h3>Cơ cấu theo kênh</h3>
      ${barRow('Off Premise', off.active, off.quay)}
      ${barRow('On Premise', on.active, on.quay)}
      <div class="foot-note">Off: ${fmtInt(off.quay)} quầy · ${fmtPct(off.active/off.quay)} đạt &nbsp;|&nbsp; On: ${fmtInt(on.quay)} quầy · ${fmtPct(on.active/on.quay)} đạt</div>
    </div>
    <div class="panel">
      <h3>Cơ cấu theo nhóm khách hàng</h3>
      ${typeOrder.map(t=>{const v=typeMap[t]||{quay:0,active:0}; return barRow(t, v.active, v.quay);}).join('')}
    </div>
  </div></section>`;

  // --- Bảng NPP -> SS quầy/active ---
  html += `<section class="block">
    <p class="block-title">Bảng chi tiết quầy theo NPP → SS</p>
    <p class="block-desc">Bấm dòng NPP để mở SS bên trong</p>
    <div class="table-wrap"><table>
      <thead><tr><th>NPP → SS</th><th>Quầy</th><th>Active T9</th><th>%Đạt</th><th>DS T9</th></tr></thead>
      <tbody>`;
  ov.npp_list.forEach((n,i)=>{
    html += `<tr class="row-ss" data-grp="npp${i}"><td><span class="chev">▶</span>${esc(n.npp)}</td>
      <td>${fmtInt(n.quay)}</td><td>${fmtInt(n.active)}</td><td>${pctBadge(n.active/n.quay)}</td><td>${fmtTr(n.ds)}</td></tr>`;
    n.ss_rows.forEach(s=>{
      html += `<tr class="row-sm" data-grp="npp${i}"><td>${esc(s.ss)}</td><td>${fmtInt(s.quay)}</td><td>${fmtInt(s.active)}</td><td>${pctBadge(s.active/s.quay)}</td><td>${fmtTr(s.ds)}</td></tr>`;
    });
  });
  const totQ=o.quay, totA=o.active;
  html += `<tr class="row-total"><td>TỔNG KHU VỰC</td><td>${fmtInt(totQ)}</td><td>${fmtInt(totA)}</td><td>${pctBadge(totA/totQ)}</td><td>${fmtTr(o.ds)}</td></tr>`;
  html += `</tbody></table></div></section>`;

  // --- KPI Nền tảng ---
  const r = kpi.region;
  html += `<section class="block">
    <p class="block-title">🎯 KPI Nền tảng (PC · LPPC) — toàn khu vực</p>

    </div>
    <div class="panel" style="margin-bottom:14px;">
      <h3>Sale Out theo SS</h3>
      ${kpi.ss_list.slice().sort((a,b)=>b.total.sale_out-a.total.sale_out).map(s=>{

      <tbody>`;
  kpi.ss_list.forEach((s,i)=>{
    const t = s.total;
    html += `<tr class="row-ss" data-grp="kpi${i}"><td><span class="chev">▶</span>${ssShort(s.ss)}</td>
      <td>${fmtTy(t.sale_out)}</td><td>${fmtTy(t.target)}</td><td>${pctBadge(t.pct)}</td>

    s.sms.forEach(m=>{
      html += `<tr class="row-sm" data-grp="kpi${i}"><td>${esc(m.sm)}</td>

function ssShort(ss){
  if(!ss) return '';
  const parts = String(ss).split('-');
  return parts.length>1 ? parts.slice(1).join('-') : ss;
}
function barRow(label, val, total){
  const p = total? val/total : 0;
  return `<div class="barrow"><div class="lbl">${esc(label)}</div><div class="bar-bg"><div class="bar-fg" style="width:${(p*100).toFixed(1)}%"></div></div><div class="val">${fmtPct(p)}</div></div>`;
}
function barRowRaw(label, val, max, valText){
  const p = max? val/max : 0;
  return `<div class="barrow"><div class="lbl">${esc(label)}</div><div class="bar-bg"><div class="bar-fg" style="width:${(p*100).toFixed(1)}%"></div></div><div class="val">${valText}</div></div>`;
}

      <thead><tr><th>SS</th><th>SM</th>${months.map(m=>`<th>${m}</th>`).join('')}<th>Số tháng làm việc</th><th>Đạt</th><th>Không đạt</th></tr></thead>
      <tbody>${warn.map(w=>`<tr><td style="text-align:left">${esc(w.ss)}</td><td style="text-align:left">${esc(w.sm)}</td>
        ${w.months.map(v=>`<td>${v==null?'—':pctBadge(v)}</td>`).join('')}
        <td>${w.worked}</td><td>${w.dat}</td><td style="color:var(--red);font-weight:700">${w.khongdat}</td></tr>`).join('')}
      </tbody></table></div>
    <p class="foot-note">${warn.length} / ${s.ss_list.reduce((a,x)=>a+x.sms.length,0)} SM đang ở diện cảnh báo</p>
  </section>`;

  html += `<section class="block">
    <p class="block-title">Chi tiết %vs Target theo tháng — SS → SM</p>
    <p class="block-desc">Bấm dòng SS để mở danh sách SM</p>
    <div class="table-wrap"><table>
      <thead><tr><th>SS → SM</th>${months.map(m=>`<th>${m}</th>`).join('')}<th>Làm việc</th><th>Đạt</th><th>Không đạt</th></tr></thead>
      <tbody>`;
  s.ss_list.forEach((ss,i)=>{
    const totWorked = ss.sms.reduce((a,x)=>a+(x.worked||0),0);
    const totDat = ss.sms.reduce((a,x)=>a+(x.dat||0),0);
    const totKD = ss.sms.reduce((a,x)=>a+(x.khongdat||0),0);
    html += `<tr class="row-ss" data-grp="sot${i}"><td><span class="chev">▶</span>${esc(ss.ss)} <span class="pill">${ss.sms.length} SM</span></td>
      ${months.map((m,mi)=>'<td>—</td>').join('')}<td>${totWorked}</td><td>${totDat}</td><td>${totKD}</td></tr>`;
    ss.sms.forEach(sm=>{
      html += `<tr class="row-sm" data-grp="sot${i}"><td>${esc(sm.sm)}</td>
        ${sm.months.map(v=>`<td>${v==null?'—':pctBadge(v)}</td>`).join('')}
        <td>${sm.worked}</td><td>${sm.dat}</td><td>${sm.khongdat}</td></tr>`;
    });
  });
  html += `</tbody></table></div></section>`;

  el.innerHTML = html;
}

// ================= wiring =================
function bindDrilldown(root){
  root.querySelectorAll('tr.row-ss').forEach(row=>{
    row.addEventListener('click', ()=>{
      const grp = row.dataset.grp;
      const open = row.classList.toggle('open');
      root.querySelectorAll(`tr.row-sm[data-grp="${grp}"]`).forEach(r=>r.classList.toggle('show', open));
    });
  });
}

function bindTabs(){
  document.querySelectorAll('.tab-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
      document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('tab-'+btn.dataset.tab).classList.add('active');
    });
  });
}
